[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "DocTriage"
version = "1.0.0"
description = "Local-first document triage for manual curation, connected learning, RAG, and agent workflows."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11,<3.15"
dependencies = [
    "docling==2.94.0",
    "httpx==0.28.1",
    "pydantic==2.13.3",
    "pydantic-settings==2.14.2",
    "pypdf==6.14.2",
    "qdrant-client==1.18.0",
]

[project.scripts]
doctriage = "main:main"
doctriage-relationships = "relationship_miner:main"
doctriage-graph = "knowledge_graph:main"
doctriage-bundle = "bundle_exporter:main"
doctriage-rag = "rag_indexer:main"
doctriage-reading = "reading_tracker:main"
doctriage-reading-ui = "reading_ui:main"
doctriage-workflow = "workflow_adapter:main"

[tool.setuptools]
py-modules = ["bundle_exporter", "cleaner", "config", "embedding_store", "knowledge_graph", "main", "meta_profiler", "ollama_runtime", "rag_indexer", "rag_vector_store", "ranker_engine", "reading_tracker", "reading_ui", "relationship_miner", "runtime_encoding", "workflow_adapter"]
packages = ["doctriage_ui", "relationship_strategies"]

[tool.setuptools.package-data]
doctriage_ui = ["*.css", "*.html", "*.js"]
